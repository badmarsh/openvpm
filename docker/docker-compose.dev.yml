# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml — Vývojový režim (lokálny pnpm dev)
# ─────────────────────────────────────────────────────────────────────────────
# ÚČEL: Spúšťa iba závislosti (Postgres + MinIO). Next.js bežíte LOKÁLNE
# cez `pnpm dev` (s hot-reload). Žiadny port konflikt, maximálna rýchlosť.
#
# POUŽITIE:
#   docker compose -f docker/docker-compose.dev.yml up -d
#   pnpm dev   (v druhom termináli — web beží na http://localhost:3001)
#
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openpims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpims}
      POSTGRES_DB: ${POSTGRES_DB:-openpims}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=16MB
      - -c
      - effective_cache_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - maintenance_work_mem=256MB
      - -c
      - log_min_duration_statement=100
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openpims}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openpims123}
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openpims}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openpims123}
      S3_BUCKET: ${S3_BUCKET:-openpims}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"

volumes:
  postgres_dev_data:
  minio_dev_data:
