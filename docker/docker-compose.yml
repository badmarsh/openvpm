services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openpims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpims}
      POSTGRES_DB: ${POSTGRES_DB:-openpims}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openpims}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openpims123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openpims}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openpims123}
      S3_BUCKET: ${S3_BUCKET:-openpims}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        JAAZ_SERVER_URL: "http://jaaz-server:5174"
        NEXT_PUBLIC_JAAZ_ENABLED: ${NEXT_PUBLIC_JAAZ_ENABLED:-false}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-openpims}:${POSTGRES_PASSWORD:-openpims}@postgres:5432/${POSTGRES_DB:-openpims}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-docker-dev-secret-change-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      AI_TEXT_ENABLED: ${AI_TEXT_ENABLED:-false}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
      AGENT_MODEL: ${AGENT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-openpims}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-openpims123}}
      S3_BUCKET: ${S3_BUCKET:-openpims}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Jaaz Marketing Studio — interná URL (server-side, nie exponovaná klientovi)
      JAAZ_SERVER_URL: "http://jaaz-server:5174"
      # Feature flag — nastaviť na "true" keď je jaaz-server spustený
      NEXT_PUBLIC_JAAZ_ENABLED: ${NEXT_PUBLIC_JAAZ_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────────────────────────────────
  # Jaaz Marketing Studio — AI generátor obrázkov/videí pre social media assets
  # Spustiť s: docker compose --profile jaaz up
  # Jaaz má iba loopback port 127.0.0.1:5174; browser používa Next.js proxy (/tools/jaaz/*)
  # ─────────────────────────────────────────────────────────────────────────────
  jaaz-server:
    profiles:
      - jaaz
    build:
      context: ../jaaz
      dockerfile: Dockerfile
    restart: unless-stopped
    # Exponujeme port 5174 na hostiteľa, aby ho Next.js bežiaci mimo Dockeru mohol proxy-ovať
    ports:
      - "127.0.0.1:5174:5174"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - JAAZ_DATA_DIR=/app/data
      # Voliteľné cloud API kľúče — pridať do .env ak potrebné:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - MIDJOURNEY_API_KEY=${MIDJOURNEY_API_KEY}
    volumes:
      - jaaz_data:/app/data
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5174/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Ollama — lokálny AI model runtime (privacy-first, dáta ostávajú lokálne)
  # Spustiť s: docker compose --profile jaaz up
  ollama:
    profiles:
      - jaaz
    image: ollama/ollama:latest
    restart: unless-stopped
    # Port 11434 nie je exponovaný — prístupný len z jaaz-server kontajnera
    volumes:
      - ollama_data:/root/.ollama

  ollama-bootstrap:
    profiles:
      - jaaz
    image: curlimages/curl:latest
    depends_on:
      - ollama
    command: >
      sh -c "
      echo 'Waiting for Ollama to start...';
      until curl -s -f http://ollama:11434/api/version > /dev/null; do
        sleep 2;
      done;
      echo 'Ollama is running. Pulling llama3 model...';
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3\"}';
      echo 'Model pulled successfully.';
      "

volumes:
  postgres_data:
  minio_data:
  # Jaaz volumes — persistentné dáta pre generované assets a Ollama modely
  jaaz_data:
  ollama_data:
